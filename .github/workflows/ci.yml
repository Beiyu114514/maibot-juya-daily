name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]          # 推 tag 时跑测试 + 打包发 Release
  pull_request:           # 不限制 base 分支：stacked PR（如 #3 以 feat/qq-markdown-push 为 base）
                          # 也必须跑测试，否则合入前 CI 永远是 0 个 check
  workflow_dispatch:      # 也允许在 Actions 页面手动触发
  schedule:
    - cron: "0 22 * * *"  # 每天 22:00（UTC）跑一次真实站点集成测试

# 最小权限：默认只读，写权限按 job 单独授予（PR 触发的 test 不应有写权限）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试（真实 SDK）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write       # 夜间 live 失败时自动开 issue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12（同 MaiBot 要求）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 不开 cache: pip —— 缓存解析失败会让本步直接红（v0.2.0 首跑即此因）。
          # 现在 requirements-dev.txt 已在仓库里，若要加速可改成：
          #   cache: pip
          #   cache-dependency-path: requirements-dev.txt

      - name: Install SDK（CI 里用真包，本地无 pip 时测试自带桩）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile plugins/juya-daily/*.py

      - name: Lint（只查未定义名/语法类硬错误）
        run: ruff check plugins/juya-daily tests scripts --select E9,F63,F7,F82

      - name: Unit tests + coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=80

      # 单独跑一遍，失败信息比 coverage 汇总更直观（tests 里也已包含）
      - name: 校验安装包结构（MaiBot ZIP 规则）
        run: python -m unittest tests.test_packaging -v

      - name: Live RSS smoke（仅定时触发，避免 PR 受站点波动影响）
        id: live
        if: github.event_name == 'schedule'
        env:
          JUYA_LIVE: "1"
        run: python -m unittest tests.test_live_rss -v
        continue-on-error: true

      - name: Open issue when nightly live smoke fails
        if: steps.live.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "夜间真实站点测试失败 $(date -u +%F)" \
            --body "定时任务 \`${{ github.workflow }}\` 的真实站点冒烟失败，可能站点改版或网络异常。请查看 [运行日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。"

  package:
    name: 打包并发布 Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # 创建 Release 需要写权限
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify plugin files
        run: |
          test -f plugins/juya-daily/plugin.py
          test -f plugins/juya-daily/_manifest.json
          echo "--- manifest ---"
          cat plugins/juya-daily/_manifest.json

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(python -c "import json; print(json.load(open('plugins/juya-daily/_manifest.json'))['version'])")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 manifest 版本 v${VERSION} 不一致，拒绝打包"
            exit 1
          fi

      - name: Syntax check (py3.12, 同 MaiBot 要求)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile plugins/juya-daily/*.py

      # 必须打成「ZIP 内唯一一层 juya-daily/」，不能是 plugins/juya-daily/：
      # MaiBot WebUI 的 ZIP 安装只认根目录或唯一一层插件目录里的 _manifest.json，
      # v0.3.0 的包多套了 plugins/ 一层，导入时报「根目录或唯一一层插件目录中必须
      # 包含 _manifest.json」。结构校验写在脚本里，本地与 CI 共用同一套规则。
      - name: Build plugin ZIP（唯一一层 juya-daily/）
        run: |
          NAME="$(python scripts/package_plugin.py --out-dir . --print-name)"
          echo "ZIP_NAME=${NAME}" >> "$GITHUB_ENV"
          python scripts/package_plugin.py --verify "${NAME}"   # 复核结构，防止回归
          test -f "${NAME}.sha256"
          ls -l "${NAME}" "${NAME}.sha256"

      - name: Upload artifact（手动触发 / 非 tag 构建可在此下载）
        uses: actions/upload-artifact@v4
        with:
          name: juya-daily
          path: |
            juya-daily-*.zip
            juya-daily-*.zip.sha256
          if-no-files-found: error

      - name: Create Release & attach zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            juya-daily-*.zip
            juya-daily-*.zip.sha256
          generate_release_notes: true

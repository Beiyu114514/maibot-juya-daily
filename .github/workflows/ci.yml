name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]          # 推 tag 时跑测试 + 打包发 Release
  pull_request:
    branches: [main]
  workflow_dispatch:      # 也允许在 Actions 页面手动触发
  schedule:
    - cron: "0 22 * * *"  # 每天 22:00（UTC）跑一次真实站点集成测试

permissions:
  contents: write         # 创建 Release 需要写权限

jobs:
  test:
    name: 单元测试（真实 SDK）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12（同 MaiBot 要求）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SDK（CI 里用真包，本地无 pip 时测试自带桩）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic maibot-plugin-sdk

      - name: Syntax check
        run: python -m py_compile plugins/juya-daily/*.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Live RSS smoke（仅定时触发，避免 PR 受站点波动影响）
        if: github.event_name == 'schedule'
        env:
          JUYA_LIVE: "1"
        run: python -m unittest tests.test_live_rss -v
        continue-on-error: true

  package:
    name: 打包并发布 Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify plugin files
        run: |
          test -f plugins/juya-daily/plugin.py
          test -f plugins/juya-daily/_manifest.json
          echo "--- manifest ---"
          cat plugins/juya-daily/_manifest.json

      - name: Syntax check (py3.12, 同 MaiBot 要求)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile plugins/juya-daily/*.py

      - name: Zip plugin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "juya-daily-${VERSION}.zip" plugins/juya-daily \
            -x "*__pycache__*" "*.pyc"
          echo "ZIP_NAME=juya-daily-${VERSION}.zip" >> "$GITHUB_ENV"
          sha256sum "juya-daily-${VERSION}.zip" > "juya-daily-${VERSION}.zip.sha256"

      - name: Upload artifact（手动触发 / 非 tag 构建可在此下载）
        uses: actions/upload-artifact@v4
        with:
          name: juya-daily
          path: |
            juya-daily-*.zip
            juya-daily-*.zip.sha256
          if-no-files-found: error

      - name: Create Release & attach zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            juya-daily-*.zip
            juya-daily-*.zip.sha256
          generate_release_notes: true
